<style>
  :root {
    --bg: #0e0e0e; --surface: #1a1a1a; --border: #2a2a2a;
    --accent: #c8f135; --text: #e8e8e8; --muted: #6b6b6b; --white: #ffffff;
    --font-display: 'Bebas Neue', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: hidden; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font-body);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 40px 20px; overflow-x: hidden;
    position: relative;
  }
  .grid-bg {
    position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .glow {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 600px; height: 600px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(200,241,53,.08), transparent 70%);
  }
  .content { position: relative; z-index: 1; max-width: 480px; }
  .error-code {
    font-family: var(--font-display); font-size: clamp(100px, 22vw, 200px);
    line-height: .9; color: var(--white); letter-spacing: -.02em;
    text-shadow: 0 0 60px rgba(200,241,53,.15);
  }
  .error-code span { color: var(--accent); }
  .error-label {
    font-family: var(--font-mono); font-size: .75rem; color: var(--accent);
    letter-spacing: .25em; text-transform: uppercase; margin-top: 8px;
  }
  .error-title {
    font-family: var(--font-display); font-size: clamp(24px, 4vw, 32px);
    color: var(--white); margin-top: 24px; letter-spacing: .01em;
  }
  .error-text {
    font-size: .95rem; color: var(--muted); line-height: 1.7; margin-top: 14px;
    font-weight: 300;
  }
  .error-actions {
    display: flex; gap: 14px; justify-content: center; margin-top: 40px; flex-wrap: wrap;
  }
  .btn {
    font-family: var(--font-mono); font-size: .75rem; letter-spacing: .08em;
    text-transform: uppercase; text-decoration: none; padding: 14px 28px;
    border-radius: 100px; transition: all .25s ease; display: inline-flex;
    align-items: center; gap: 8px;
  }
  .btn-primary { background: var(--accent); color: #000; font-weight: 700; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(200,241,53,.25); }
  .btn-secondary { border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover { border-color: rgba(200,241,53,.4); color: var(--accent); }
  .error-hint {
    margin-top: 56px; font-family: var(--font-mono); font-size: .68rem;
    color: var(--muted); letter-spacing: .05em;
  }
  .error-hint a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(200,241,53,.3); }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="content">

    <div class="error-label">// Page not found</div>
    <h1 class="error-title">This screen doesn't exist yet</h1>
    <p class="error-text">
      The page you're looking for may have been moved, renamed, or never built in the first place.

    <div class="error-actions">
      <a href="./sarbesh-portfolio.html" class="btn btn-primary">← Back to Home</a>
      <a href="./sarbesh-portfolio.html#work" class="btn btn-secondary">View Work</a>

      Still stuck? Reach out at <a href="mailto:sarbeshlal.amatya@gmail.com">sarbeshlal.amatya@gmail.com</a>
    </div>
  </div>
</body>
